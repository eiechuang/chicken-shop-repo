spring.datasource.url=jdbc:h2:file:/data/chickendb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always







spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.schema-locations=classpath:schema.sql

app.ai.enabled=${AI_ENABLED:false}

spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding.text=${SPRING_AI_MODEL_EMBEDDING_TEXT:none}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Scheduled autonomous pickup reminders. Manual trigger is also available.
app.reminders.cron=${REMINDER_CRON:0 0 9 * * *}
